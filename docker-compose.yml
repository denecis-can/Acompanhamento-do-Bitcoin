services:
  dashboard:
    build: .
    container_name: btc-dashboard
    ports:
      # só nesta máquina: o dashboard não fica acessível pela rede
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_PATH: /app/data/btc_dashboard.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
